name: release

# Build all lanes, collect the .debs, regenerate the apt index, and push it to
# the erv5/repo GitHub Pages repo (served at https://repo.soardev.cc).
#
# Triggered by pushing a version tag (e.g. `git tag v4.0.0 && git push --tags`),
# or manually via workflow_dispatch. Requires a REPO_PUSH_TOKEN secret: a
# fine-grained PAT (or deploy key) with contents:write on erv5/repo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: /opt/theos
  # HookKit pin — must match .github/workflows/build.yml (single source of truth).
  HOOKKIT: af17d64def73be78f46f55c82592726ee4afeb74

jobs:
  package:
    name: package ${{ matrix.flavor }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # Lanes whose debs we publish: rootless (Dopamine) + roothide. Rootful
        # lanes are intentionally excluded for now.
        flavor: [rootless, roothide]
    steps:
      - uses: actions/checkout@v5

      - name: Install Theos
        run: |
          brew install dpkg ldid
          sudo git clone --recursive --quiet https://github.com/jjolano/theos.git "$THEOS"
          curl -fL -o "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          echo '5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb  '"$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" | shasum -a 256 -c -
          sudo mkdir -p "$THEOS/sdks"
          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS16.5.sdk.tar.xz" -C "$THEOS/sdks"
          curl -fL -o "$RUNNER_TEMP/iPhoneOS14.5.sdk.tar.xz" \
            https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS14.5.sdk.tar.xz
          echo '1c998a5ee7eb8c29e39f0d8c83add9cad1a954342ca0d86204d1b4fe08a921b9  '"$RUNNER_TEMP/iPhoneOS14.5.sdk.tar.xz" | shasum -a 256 -c -
          sudo tar -xJf "$RUNNER_TEMP/iPhoneOS14.5.sdk.tar.xz" -C "$THEOS/sdks"
          sudo chown -R "$(id -un)" "$THEOS"

      - name: Build
        env:
          SHADOW_HOOKKIT_ABI_STRICT: 1
        run: |
          .github/scripts/install-hookkit-theos.sh "${{ matrix.flavor }}"
          .github/scripts/build-deps.sh "${{ matrix.flavor }}"
          ./build.sh "${{ matrix.flavor }}"

      - uses: actions/upload-artifact@v6
        with:
          name: shadow-${{ matrix.flavor }}
          path: build/*.deb

  publish:
    name: publish to erv5/repo
    needs: package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install dpkg (dpkg-scanpackages for the apt index)
        run: brew install dpkg

      - name: Download lane debs
        uses: actions/download-artifact@v7
        with:
          pattern: shadow-*
          path: release-debs
          merge-multiple: true

      # Only publish Shadow itself. build-deps also produces the opa334
      # dependency debs (com.opa334.altlist, com.opa334.libsandy) into the same
      # build/ dir; those belong to opa334's repo, not ours — users add his repo
      # for the deps. Keep only me.jjolano.shadow debs here.
      - name: Keep only Shadow debs (drop opa334 deps)
        run: |
          find release-debs -name '*.deb' ! -name 'me.jjolano.shadow_*' -delete
          echo "publishing:"; ls -1 release-debs/*.deb

      - name: Check out erv5/repo
        uses: actions/checkout@v5
        with:
          repository: erv5/repo
          token: ${{ secrets.REPO_PUSH_TOKEN }}
          path: erv5-repo

      - name: Regenerate apt index
        run: .github/scripts/publish-repo.sh erv5-repo release-debs

      - name: Commit and push repo index
        working-directory: erv5-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "repo index unchanged; nothing to push"
            exit 0
          fi
          git commit -m "publish: ${{ github.ref_name }} (${{ github.sha }})"
          git push
